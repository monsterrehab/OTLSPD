<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTPD - Büntetési Törvénykönyv</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Special+Elite&display=swap');

        :root {
            --paper-color: #f3ebd3; /* Az eredeti kép sárgás-barna papír tónusa */
            --ink-color: #1a1a1a;
            --header-font: 'Oswald', sans-serif;
            --body-font: 'Special Elite', cursive;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--body-font);
            background-color: #1e1e1e;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        /* Papír textúra és konténer */
        .document {
            background-color: var(--paper-color);
            width: 100%;
            max-width: 1000px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #c5b897;
            position: relative;
            background-image: radial-gradient(rgba(0,0,0,0.05) 15%, transparent 15%), radial-gradient(rgba(0,0,0,0.05) 15%, transparent 15%);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            border-radius: 4px;
            margin-bottom: 120px; /* Hely az alsó fix panelnek mobilon */
        }

        /* Fejléc */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px double var(--ink-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .header-center {
            text-align: center;
            flex-grow: 1;
        }

        .header-center h1 {
            font-family: var(--header-font);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #111;
        }

        .header-center h2 {
            font-family: var(--header-font);
            font-size: clamp(1rem, 3vw, 1.8rem);
            margin: 5px 0 0;
            font-weight: 700;
            color: #8b0000; /* Bordós-pirosas kiemelés mint a képen */
            letter-spacing: 2px;
        }

        .header-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: clamp(50px, 10vw, 80px);
        }

        .header-side img {
            width: 100%;
            height: auto;
            opacity: 0.85;
        }

        .header-side .est {
            font-family: var(--header-font);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            font-weight: bold;
        }

        /* Kereső */
        .search-container {
            width: 100%;
            margin-bottom: 20px;
            text-align: center;
        }

        .search-box {
            font-family: var(--body-font);
            width: 100%;
            max-width: 500px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid var(--ink-color);
            color: var(--ink-color);
            font-size: 1rem;
            text-align: center;
        }

        /* Reszponzív Grid rendszer a kategóriáknak */
        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Az I. és II. kategória egymás mellett lesz asztali gépen */
        .row-twin {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .row-twin {
                flex-direction: row;
            }
            .row-twin .category-block {
                flex: 1;
            }
            .document {
                padding: 40px;
            }
        }

        .category-block {
            background: rgba(0, 0, 0, 0.02);
            padding: 10px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .category-title {
            font-family: var(--header-font);
            font-size: 1.1rem;
            color: var(--ink-color);
            border-bottom: 2px solid var(--ink-color);
            padding-bottom: 5px;
            margin-top: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-align: center;
        }

        /* Táblázat reszponzivitás */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .crime-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .crime-table th, .crime-table td {
            text-align: left;
            padding: 6px 4px;
            border-bottom: 1px solid rgba(0,0,0,0.15);
            vertical-align: middle;
        }

        .crime-table th {
            font-family: var(--header-font);
            text-transform: uppercase;
            font-size: 0.8rem;
            border-bottom: 2px solid var(--ink-color);
        }

        .col-check { width: 30px; text-align: center; }
        .col-name { width: auto; }
        .col-punishment { width: 110px; font-weight: bold; text-align: right; }

        .crime-item {
            cursor: pointer;
        }

        .crime-item:hover {
            background-color: rgba(0,0,0,0.05);
        }

        .crime-item input[type="checkbox"] {
            transform: scale(1.2);
            cursor: pointer;
        }

        /* Alsó fix összesítő panel - mobilon és asztalin is jól látszik */
        .summary-block {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #11141a;
            color: #fff;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 9999;
            border-top: 3px solid #8b0000;
        }

        .summary-container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .summary-title {
            font-family: var(--header-font);
            font-size: 1.1rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ccc;
        }

        .summary-flex {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .summary-item {
            font-size: 0.9rem;
            font-family: var(--header-font);
            text-transform: uppercase;
        }

        .summary-value {
            font-family: var(--body-font);
            font-weight: bold;
            display: block;
            font-size: 1.2rem;
            color: #ff4d4d;
            margin-top: 3px;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            border-top: 1px solid var(--ink-color);
            padding-top: 15px;
            font-family: var(--header-font);
            font-size: 0.8rem;
            color: rgba(0,0,0,0.6);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="document">
    
    <div class="header">
        <div class="header-side">
            <img src="https://cdn.discordapp.com/attachments/1501971304125960354/1509650152363786531/zmwhjp6.png?ex=6a3edcc4&is=6a3d8b44&hm=ad47f55bfabc2d15c69a79ef33316f16b8b45adb28c887838f026b8320b999c2&" alt="OTPD">
            <span class="est">1985</span>
        </div>
        <div class="header-center">
            <h1>Old Town Police Department</h1>
            <h2>BÜNTETÉSI TÖRÖNYKÖNYV</h2>
        </div>
        <div class="header-side">
            <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="USA">
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="search" class="search-box" placeholder="KERESÉS... (pl. 'szándékos', 'Garázdaság')">
    </div>

    <div class="grid-container">
        
        <div class="row-twin">
            <div id="cat-block-I" class="category-block"></div>
            <div id="cat-block-II" class="category-block"></div>
        </div>

        <div id="cat-block-III" class="category-block"></div>
        
    </div>

    <div class="footer">
        ★ LAW. ORDER. JUSTICE. ★ OTPD-85-BTK, LOS SANTOS, USA
    </div>
</div>

<div class="summary-block">
    <div class="summary-container">
        <div class="summary-title">Összesített büntetés számítása</div>
        <div class="summary-flex">
            <div class="summary-item">Börtön:<span id="total-borton" class="summary-value">0 perc</span></div>
            <div class="summary-item">Fogda:<span id="total-fogda" class="summary-value">0 perc</span></div>
            <div class="summary-item">Pénzbírság:<span id="total-money" class="summary-value">0 $</span></div>
        </div>
    </div>
</div>

<script>
    const lawBook = [
        {
            targetId: "cat-block-I",
            category: "I. KIEMELT BŰNCSELEKMÉNYEK (BÖRTÖN)",
            items: [
                { id: "i1", name: "Szándékos emberölés", borton: 60, fogda: 0, money: 0, display: "60 p" },
                { id: "i2", name: "Emberölési kísérlet", borton: 50, fogda: 0, money: 0, display: "50 p" },
                { id: "i3", name: "Pénzhamisítás", borton: 50, fogda: 0, money: 0, display: "50 p" },
                { id: "i4", name: "Fegyveres rablás", borton: 45, fogda: 0, money: 0, display: "45 p" },
                { id: "i5", name: "Emberrablás", borton: 45, fogda: 0, money: 0, display: "45 p" },
                { id: "i6", name: "Bankrablás", borton: 40, fogda: 0, money: 0, display: "40 p" },
                { id: "i13", name: "Korrupció", borton: 240, fogda: 0, money: 0, display: "240 p" }
            ]
        },
        {
            targetId: "cat-block-II",
            category: "II. BŰNCSELEKMÉNYEK (FOGDA)",
            items: [
                { id: "ii1", name: "Garázdaság", borton: 0, fogda: 30, money: 0, display: "30 p / 200$" },
                { id: "ii2", name: "Súlyos testi sértés", borton: 0, fogda: 30, money: 0, display: "30 p" },
                { id: "ii3", name: "Rendőri intézkedés akadályozása", borton: 0, fogda: 25, money: 0, display: "25 p / 200$" },
                { id: "ii7", name: "Kábítószer birtoklása", borton: 0, fogda: 20, money: 0, display: "20 p / 300$" }
            ]
        },
        {
            targetId: "cat-block-III",
            category: "III. SZABÁLYSÉRTÉSEK (PÉNZBÍRSÁG)",
            items: [
                { id: "iii1", name: "Hamis pénz birtoklása", borton: 0, fogda: 0, money: 200, display: "200 $" },
                { id: "iii2", name: "Jogosulatlan behajtás állami területre", borton: 0, fogda: 0, money: 150, display: "150 $" },
                { id: "iii3", name: "Közlekedési baleset okozása", borton: 0, fogda: 0, money: 100, display: "100 $" },
                { id: "iii10", name: "Gyorshajtás", borton: 0, fogda: 0, money: 50, display: "50 $" }
            ]
        }
    ];

    // Felület felépítése
    lawBook.forEach(cat => {
        const targetDiv = document.getElementById(cat.targetId);
        if (!targetDiv) return;

        targetDiv.innerHTML = `<h3 class="category-title">${cat.category}</h3>`;
        
        const responsiveWrapper = document.createElement('div');
        responsiveWrapper.className = 'table-responsive';

        const table = document.createElement('table');
        table.className = 'crime-table';
        
        table.innerHTML = `
            <thead>
                <tr>
                    <th class="col-check">&nbsp;</th>
                    <th class="col-name">BŰNCSELEKMÉNY</th>
                    <th class="col-punishment">BÜNTETÉS</th>
                </tr>
            </thead>
        `;
        
        const tbody = document.createElement('tbody');

        cat.items.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = 'crime-item';
            tr.dataset.name = item.name.toLowerCase();
            tr.innerHTML = `
                <td class="col-check"><input type="checkbox" value="${item.id}" data-borton="${item.borton}" data-fogda="${item.fogda}" data-money="${item.money}"></td>
                <td class="col-name">${item.name}</td>
                <td class="col-punishment">${item.display}</td>
            `;
            
            // Ha a sorra kattintanak, a checkbox is jelölődjön be
            tr.addEventListener('click', function(e) {
                if (e.target.type !== 'checkbox') {
                    const cb = this.querySelector('input[type="checkbox"]');
                    cb.checked = !cb.checked;
                    calculateTotal();
                }
            });

            tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        responsiveWrapper.appendChild(table);
        targetDiv.appendChild(responsiveWrapper);
    });

    // Kalkuláció és eseménykezelés
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(cb => cb.addEventListener('change', calculateTotal));

    function calculateTotal() {
        let borton = 0, fogda = 0, money = 0;
        
        document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
            borton += parseInt(cb.dataset.borton || 0);
            fogda += parseInt(cb.dataset.fogda || 0);
            money += parseInt(cb.dataset.money || 0);
        });

        document.getElementById('total-borton').innerText = `${borton} perc`;
        document.getElementById('total-fogda').innerText = `${fogda} perc`;
        document.getElementById('total-money').innerText = `${money} $`;
    }

    // JAVÍTOTT ÉS JÓL MŰKÖDŐ KERESŐ
    document.getElementById('search').addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase();
        
        document.querySelectorAll('.crime-table tbody .crime-item').forEach(item => {
            if (item.dataset.name.includes(query)) {
                item.classList.remove('hidden');
            } else {
                item.classList.add('hidden');
            }
        });
    });
</script>
</body>
</html>
